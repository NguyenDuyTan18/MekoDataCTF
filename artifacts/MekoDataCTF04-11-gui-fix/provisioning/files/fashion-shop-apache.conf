<VirtualHost *:80>
    ServerName fashion-shop.local
    ProxyRequests Off
    ProxyPreserveHost On
    # Specific desktop routes must precede the shop catch-all.
    ProxyPass /desktop/websockify ws://127.0.0.1:6080/ timeout=300
    ProxyPassReverse /desktop/websockify ws://127.0.0.1:6080/
    ProxyPass /desktop/ !
    Alias /desktop/ /usr/share/novnc/
    <Directory /usr/share/novnc/>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex fashion.html
    </Directory>
    ProxyPass / http://127.0.0.1:8080/ connectiontimeout=5 timeout=30
    ProxyPassReverse / http://127.0.0.1:8080/
    ErrorLog ${APACHE_LOG_DIR}/fashion-shop-error.log
    CustomLog ${APACHE_LOG_DIR}/fashion-shop-access.log combined
</VirtualHost>
