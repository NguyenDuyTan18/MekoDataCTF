---
- name: Validate the Open GUI endpoint
  ansible.builtin.assert:
    that:
      - meko_vnc_port | int >= 5900 and meko_vnc_port | int <= 5999
      - meko_vnc_display | int >= 1 and meko_vnc_display | int <= 99
      - not (meko_vnc_localhost | bool)
    fail_msg: Open GUI requires a reachable VNC listener, normally port 5900.
- name: Read persistent GUI credentials
  ansible.builtin.slurp:
    src: /etc/meko-boutique/gui-credentials.json
  register: meko_previous_gui
  failed_when: false
  no_log: true
- name: Load prior GUI credentials
  ansible.builtin.set_fact:
    meko_saved_gui: "{{ (meko_previous_gui.content | b64decode | from_json) if meko_previous_gui.content is defined else {} }}"
  no_log: true
- name: Select private or stable generated VNC password
  ansible.builtin.set_fact:
    meko_gui_password: "{{ (meko_trainee_vnc_passwords | default({}))[inventory_hostname] | default(meko_saved_gui[inventory_hostname] | default(lookup('ansible.builtin.password', '/dev/null length=8 chars=ascii_letters,digits'))) }}"
  no_log: true
- name: Validate VNC password before changing the desktop
  ansible.builtin.assert:
    that:
      - meko_gui_password is string
      - meko_gui_password | length == 8
      - meko_gui_password.isascii() and meko_gui_password.isalnum()
  no_log: true
- name: Persist this team VNC credential for reprovisioning
  ansible.builtin.copy:
    dest: /etc/meko-boutique/gui-credentials.json
    content: "{{ meko_saved_gui | combine({inventory_hostname: meko_gui_password}) | to_nice_json }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
- name: Pass this team VNC credential to the private probes
  ansible.builtin.set_fact:
    meko_gui_passwords: '{{ {inventory_hostname: meko_gui_password} }}'
  no_log: true

- name: Install Kali XFCE desktop and VNC runtime
  ansible.builtin.apt:
    # Use the XFCE runtime directly; the Kali branding metapackage is optional.
    name: [xfce4, xfce4-terminal, tigervnc-standalone-server, tigervnc-tools, xauth, xfonts-base, dbus-x11, firefox-esr, acl, iproute2, python3-pycryptodome]
    state: present
    update_cache: true
    cache_valid_time: 3600
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Check the hostname required by TigerVNC
  ansible.builtin.command:
    argv: [/bin/hostname, '-f']
  register: meko_hostname_check
  changed_when: false
  failed_when: false

- name: Resolve the local hostname on minimal cloud images
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: '# {mark} FASHION SHOP HOSTNAME'
    block: '127.0.1.1 {{ ansible_hostname }}'
  when: meko_hostname_check.rc != 0 or meko_hostname_check.stdout | trim == ''

- name: Verify the hostname before launching the VNC wrapper
  ansible.builtin.command:
    argv: [/bin/hostname, '-f']
  register: meko_hostname_ready
  changed_when: false
  failed_when: meko_hostname_ready.rc != 0 or meko_hostname_ready.stdout | trim == ''

- name: Create desktop helper directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install desktop helpers
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '/usr/local/libexec/{{ item.dest }}'
    owner: root
    group: root
    mode: '0755'
  loop:
    - {src: meko-xfce, dest: meko-xfce}
    - {src: set-vnc-password.py, dest: meko-set-vnc-password}
    - {src: vnc-listener.py, dest: meko-vnc-listener}
    - {src: check-vnc.py, dest: meko-check-vnc}
  register: meko_desktop_helpers

- name: Create the private VNC directory
  ansible.builtin.file:
    path: /home/{{ inventory_hostname }}/.vnc
    state: directory
    owner: '{{ inventory_hostname }}'
    group: users
    mode: '0700'

- name: Create the trainee XDG configuration directory
  ansible.builtin.file:
    path: /home/{{ inventory_hostname }}/.config
    state: directory
    owner: '{{ inventory_hostname }}'
    group: users
    mode: '0700'

- name: Create the modern TigerVNC configuration directory
  ansible.builtin.file:
    path: /home/{{ inventory_hostname }}/.config/tigervnc
    state: directory
    owner: '{{ inventory_hostname }}'
    group: users
    mode: '0700'

- name: Store the private VNC password
  become: true
  become_user: '{{ inventory_hostname }}'
  environment:
    HOME: '/home/{{ inventory_hostname }}'
  ansible.builtin.command:
    argv: [/usr/bin/python3, /usr/local/libexec/meko-set-vnc-password]
    stdin: '{{ meko_gui_passwords[inventory_hostname] }}'
  register: meko_vnc_password_result
  changed_when: meko_vnc_password_result.stdout == 'changed'
  no_log: true

- name: Create the trainee desktop directory
  ansible.builtin.file:
    path: /home/{{ inventory_hostname }}/Desktop
    state: directory
    owner: '{{ inventory_hostname }}'
    group: users
    mode: '0700'

- name: Add the shop shortcut to the desktop
  ansible.builtin.copy:
    dest: /home/{{ inventory_hostname }}/Desktop/shop.desktop
    owner: '{{ inventory_hostname }}'
    group: users
    mode: '0700'
    content: |
      [Desktop Entry]
      Type=Application
      Name=Meko Boutique V2 - {{ inventory_hostname }}
      Exec=firefox-esr http://127.0.0.1/
      Icon=web-browser
      Terminal=false

- name: Install the unprivileged desktop service
  ansible.builtin.template:
    src: '{{ playbook_dir }}/files/meko-desktop.service'
    dest: /etc/systemd/system/meko-desktop.service
    owner: root
    group: root
    mode: '0644'
  register: meko_desktop_unit

- name: Identify the current VNC listener without stopping it
  ansible.builtin.command:
    argv: [/usr/bin/python3, /usr/local/libexec/meko-vnc-listener, '--port', '{{ meko_vnc_port | default(5900) | int }}']
    stdin: "{{ meko_vnc_replace_units | default(['xvnc.socket', 'vncserver.socket', 'tigervnc.socket', 'x11vnc.socket', 'lightdm.service', 'x11vnc.service']) | to_json }}"
  register: meko_vnc_listener_result
  changed_when: false

- name: Keep the verified VNC migration plan
  ansible.builtin.set_fact:
    meko_vnc_listener_plan: '{{ meko_vnc_listener_result.stdout | from_json }}'

- name: Refuse to replace an unknown or protected listener
  ansible.builtin.assert:
    that:
      - meko_vnc_listener_plan.unknown | length == 0
    fail_msg: 'VNC port owner requires review: {{ meko_vnc_listener_plan.unknown }}. No service has been stopped.'

- name: Start and verify the desktop with failure diagnostics
  block:
    - name: Remember the startup policy of verified native GUI services
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, is-enabled, '{{ item }}']
      loop: '{{ meko_vnc_listener_plan.stop_units }}'
      register: meko_native_vnc_policy
      changed_when: false
      failed_when: false

    - name: Stop only verified native VNC services
      ansible.builtin.systemd:
        name: '{{ item }}'
        state: stopped
        enabled: false
      loop: '{{ meko_vnc_listener_plan.stop_units }}'
      register: meko_native_vnc_stopped

    - name: Require the VNC port to be free on first start
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: '{{ meko_vnc_port | default(5900) | int }}'
        state: stopped
        timeout: 3
      when: not meko_vnc_listener_plan.own_listener

    - name: Start the desktop service
      ansible.builtin.systemd:
        name: meko-desktop
        daemon_reload: true
        enabled: true
        state: "{{ 'restarted' if (meko_desktop_helpers.changed or meko_vnc_password_result.changed or meko_desktop_unit.changed) else 'started' }}"

    - name: Verify the VNC listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: '{{ meko_vnc_port | default(5900) | int }}'
        search_regex: '^RFB '
        timeout: 60

    - name: Verify the XFCE desktop session
      ansible.builtin.command:
        argv: [/usr/bin/pgrep, '-u', '{{ inventory_hostname }}', '-x', xfce4-session]
      register: meko_xfce_session
      changed_when: false
      retries: 15
      delay: 2
      until: meko_xfce_session.rc == 0

    - name: Authenticate VNC and receive a desktop frame
      ansible.builtin.command:
        argv: [/usr/bin/python3, /usr/local/libexec/meko-check-vnc, '--port', '{{ meko_vnc_port | default(5900) | int }}']
        stdin: '{{ meko_gui_passwords[inventory_hostname] }}'
      register: meko_vnc_frame
      changed_when: false
      retries: 3
      delay: 3
      until: meko_vnc_frame.rc == 0
      no_log: true
  rescue:
    - name: Read desktop systemd failure details
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, show, meko-desktop, '--property=Result,ActiveState,ExecMainStatus,ExecStartPre']
      register: meko_desktop_failure
      changed_when: false
      failed_when: false

    - name: Read recent desktop journal
      ansible.builtin.command:
        argv: [/usr/bin/journalctl, '-u', meko-desktop, '-n', '80', '--no-pager', '-o', cat]
      register: meko_desktop_journal
      changed_when: false
      failed_when: false

    - name: Stop the failed lab GUI before restoring the native listener
      ansible.builtin.systemd:
        name: meko-desktop
        state: stopped
      when: meko_native_vnc_stopped is defined and meko_native_vnc_stopped.changed
      failed_when: false

    - name: Restore the verified native GUI services after a failed migration
      ansible.builtin.systemd:
        name: '{{ item.item }}'
        state: started
        enabled: '{{ true if (item.stdout | trim == "enabled") else omit }}'
      loop: '{{ meko_native_vnc_policy.results | default([]) }}'
      register: meko_native_vnc_restore
      failed_when: false

    - name: Explain the desktop failure without hiding it
      ansible.builtin.fail:
        msg: |
          Desktop startup or verification failed on {{ inventory_hostname }}.
          {{ meko_desktop_failure.stdout | default('No systemd status available') }}
          Recent journal:
          {{ meko_desktop_journal.stdout | default('No journal available') }}
          VNC authentication/frame check: {{ meko_vnc_frame.stderr | default('Not reached') }}
          Gateway authentication/frame: {{ meko_gateway_frame.stderr | default('Not reached') }}
          Native GUI rollback: {{ meko_native_vnc_restore.results | default([]) | map(attribute='item.item') | list }}.
          Review the restore task results if a native GUI service did not restart.
          This GUI step runs before web deployment and can also be invoked independently.

- name: Install the gateway VNC probe runtime
  ansible.builtin.apt:
    name: [python3, python3-pycryptodome]
    state: present
    update_cache: true
    cache_valid_time: 3600
  delegate_to: gateway
  become: true
  run_once: true

- name: Verify the external VNC path without rolling back a healthy desktop
  block:
    - name: Verify VNC is reachable over the sandbox network
      ansible.builtin.wait_for:
        host: '{{ meko_team_addresses[inventory_hostname] }}'
        port: '{{ meko_vnc_port | default(5900) | int }}'
        search_regex: '^RFB '
        timeout: 30
      delegate_to: gateway
      become: false

    - name: Authenticate VNC from gateway and receive a desktop frame
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - '-c'
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/files/check-vnc.py') }}"
          - '--host'
          - '{{ meko_team_addresses[inventory_hostname] }}'
          - '--port'
          - '{{ meko_vnc_port | default(5900) | int }}'
        stdin: '{{ meko_gui_passwords[inventory_hostname] }}'
      delegate_to: gateway
      become: false
      register: meko_gateway_frame
      changed_when: false
      retries: 3
      delay: 3
      until: meko_gateway_frame.rc == 0
      no_log: true
  rescue:
    - name: Report network failure while retaining the verified desktop
      ansible.builtin.fail:
        msg: >-
          VNC authentication and framebuffer work locally on {{ inventory_hostname }}.
          The gateway-to-team VNC check failed; the desktop has been left running.
          Check routing, firewall, port, and the actual guacd connection target.
          Gateway probe: {{ meko_gateway_frame.stderr | default('TCP/banner check failed before authentication') }}
