---
- name: Repair CyberRange Open GUI independently of shop deployment
  hosts: 'team1:team2:team3:team4'
  become: true
  vars:
    meko_team_addresses: {team1: '10.93.0.11', team2: '10.93.0.12', team3: '10.93.0.13', team4: '10.93.0.14'}
  tasks:
    - name: Configure the trainee account and stable credentials
      ansible.builtin.include_tasks: trainee-access.yml
    - name: Configure and verify the Open GUI endpoint
      ansible.builtin.include_tasks: desktop.yml
  handlers:
    - name: Reload SSH
      ansible.builtin.service: {name: ssh, state: reloaded}
