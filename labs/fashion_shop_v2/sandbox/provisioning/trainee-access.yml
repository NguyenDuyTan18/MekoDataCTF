---
- name: Confirm the CyberRange management identity is separate from trainee accounts
  ansible.builtin.assert:
    that: ansible_user is defined and ansible_user not in ['kali', 'team1', 'team2', 'team3', 'team4']
    fail_msg: Use the image management account (for example debian); this playbook preserves it.
- name: Install account and SSH runtime
  ansible.builtin.apt:
    name: [python3, openssl, openssh-server, passwd]
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Create protected configuration directory
  ansible.builtin.file:
    path: /etc/meko-boutique
    state: directory
    owner: root
    group: root
    mode: '0700'
- name: Read previously generated credentials for stable reprovisioning
  ansible.builtin.slurp:
    src: /etc/meko-boutique/credentials.json
  register: meko_previous_credentials
  failed_when: false
  no_log: true
- name: Load prior per-team credential when it exists
  ansible.builtin.set_fact:
    meko_saved_credentials: "{{ (meko_previous_credentials.content | b64decode | from_json) if meko_previous_credentials.content is defined else {} }}"
  no_log: true
- name: Generate one stable password only when none is configured or saved
  ansible.builtin.set_fact:
    meko_team_password: "{{ meko_trainee_passwords[inventory_hostname] | default(meko_saved_credentials[inventory_hostname] | default(lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits'))) }}"
  no_log: true
- name: Require explicit configuration to include exactly four unique passwords
  ansible.builtin.assert:
    that:
      - meko_trainee_passwords is mapping
      - meko_trainee_passwords.keys() | list | sort == ['team1','team2','team3','team4']
      - meko_trainee_passwords.values() | list | unique | list | length == 4
      - meko_team_password | length >= 16
  when: meko_trainee_passwords | length > 0
  no_log: true
- name: Persist credential mapping for reprovisioning
  ansible.builtin.copy:
    dest: /etc/meko-boutique/credentials.json
    owner: root
    group: root
    mode: '0600'
    content: "{{ meko_saved_credentials | combine({inventory_hostname: meko_team_password}) | to_nice_json }}"
  no_log: true
- name: Create team account for local GUI, console, and SSH
  ansible.builtin.user:
    name: '{{ inventory_hostname }}'
    group: users
    shell: /bin/bash
    create_home: true
    password_lock: false
    groups: ''
    append: false
  register: meko_user
- name: Set its dedicated password
  ansible.builtin.command:
    argv: [/usr/sbin/chpasswd]
    stdin: '{{ inventory_hostname }}:{{ meko_team_password }}'
  changed_when: true
  no_log: true
- name: Detect the image's default kali account
  ansible.builtin.getent:
    database: passwd
    key: kali
    fail_key: false
- name: Lock and disable the image's default kali login
  ansible.builtin.user:
    name: kali
    password_lock: true
    shell: /usr/sbin/nologin
  when: ansible_facts.getent_passwd.get('kali') is not none
- name: Ensure SSH drop-in configuration directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Ensure password SSH is available for trainee accounts
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/90-meko-trainee.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      Match User team1,team2,team3,team4
          PasswordAuthentication yes
          PubkeyAuthentication no
          KbdInteractiveAuthentication no
          AuthenticationMethods password
          PermitEmptyPasswords no
      Match all
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Reload SSH
