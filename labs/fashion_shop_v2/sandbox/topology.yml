name: meko-boutique-v2
hosts:
  - name: team1
    base_box: {image: kali, mgmt_user: debian}
    flavor: standard.kali
  - name: team2
    base_box: {image: kali, mgmt_user: debian}
    flavor: standard.kali
  - name: team3
    base_box: {image: kali, mgmt_user: debian}
    flavor: standard.kali
  - name: team4
    base_box: {image: kali, mgmt_user: debian}
    flavor: standard.kali
routers:
  - name: gateway
    base_box: {image: debian-12-x86_64, mgmt_user: debian}
    flavor: standard.small
wan: {name: meko-v2-wan, cidr: 100.113.0.0/24}
networks:
  - name: meko-v2-lan
    cidr: 10.93.0.0/24
    accessible_by_user: true
net_mappings:
  - {host: team1, network: meko-v2-lan, ip: 10.93.0.11}
  - {host: team2, network: meko-v2-lan, ip: 10.93.0.12}
  - {host: team3, network: meko-v2-lan, ip: 10.93.0.13}
  - {host: team4, network: meko-v2-lan, ip: 10.93.0.14}
router_mappings:
  - {router: gateway, network: meko-v2-lan, ip: 10.93.0.1}
groups:
  - name: meko-teams
    nodes: [team1, team2, team3, team4]
